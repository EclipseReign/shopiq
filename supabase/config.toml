project_id = "shopiq"

[api]
enabled = true
schemas = ["public"]
max_rows = 1000

[db]
major_version = 17

[db.seed]
enabled = false

[auth]
site_url = "https://shopiq.feedfix-cloudflare.workers.dev"
additional_redirect_urls = ["https://shopiq.feedfix-cloudflare.workers.dev/login", "https://shopiq.feedfix-cloudflare.workers.dev/login?reset=1", "http://127.0.0.1:3000/login", "http://127.0.0.1:3000/login?reset=1"]
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12
jwt_expiry = 3600

[auth.email]
enabled = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "60s"
otp_length = 8
otp_expiry = 3600

[auth.email.smtp]
enabled = true
host = "smtp.gmail.com"
port = 587
user = "saint.john.bobby@gmail.com"
admin_email = "saint.john.bobby@gmail.com"
sender_name = "ShopIQ"
pass = "env(SHOPIQ_SMTP_PASSWORD)"
